<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self'; script-src 'self'" />
    <link rel="stylesheet" href="listen.css" />
  </head>
  <body>
    <div id="card" class="card">
      <p id="prompt" class="prompt">Talk with Wispr Flow</p>
      <textarea id="input" rows="2" placeholder="Hold your Flow key and say what Max should write…" spellcheck="false"></textarea>
      <p class="hint">Flow types here, Max takes it from there · <kbd>Enter</kbd> send · <kbd>Esc</kbd> cancel</p>
    </div>
    <script src="listen.js"></script>
  </body>
</html>
