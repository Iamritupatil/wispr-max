# Push a tag like v0.2.0 to build installers for Windows, macOS and Linux and
# publish them as a GitHub Release. Installed copies of Wispr Max find the new
# release through the Update button in Settings.
#
#   npm version minor        # bumps package.json and creates the tag
#   git push --follow-tags
name: Release

on:
  push:
    tags: ["v*"]
    # Or push main to the release branch: the release (and its v<version> tag)
    # is created from package.json's version.
    branches: [release]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Unsigned builds: Windows shows a SmartScreen prompt and macOS needs
          # right-click → Open the first time. Add signing secrets here later.
          CSC_IDENTITY_AUTO_DISCOVERY: false
